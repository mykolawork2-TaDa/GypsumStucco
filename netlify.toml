[build]
  publish = "public"
  # Немає команди білду — статичний сайт, JSON файли зберігаються прямо в public/

[[headers]]
  for = "/data/*"
  [headers.values]
    # Дозволяємо браузеру кешувати JSON але оновлювати при новому деплої
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    # Адмінка не кешується
    Cache-Control = "no-cache, no-store"
